name: Trampa Carnada

on:
  workflow_dispatch:

jobs:
  carnada:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install --quiet numpy pandas requests python-dotenv
      - name: carnada
        env:
          OKX_API_KEY: AAAA-BBBB-CCCC-DDDD
          OKX_API_SECRET: carnada-falsa-123
          OKX_PASSPHRASE: carnada-falsa-123
        run: python panda_gscsi_live.py --mode inspect
