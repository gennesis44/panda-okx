name: Bot AVAX (Navio El Octavo)

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada hora en punto (alineado con AVAX_TF="1h")
  workflow_dispatch:       # Permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  ejecutar-avax:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias (ccxt)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install ccxt
          fi

      - name: Ejecutar script de AVAX
        env:
          # Claves API de OKX (asegúrate de configurarlas en Settings > Secrets and variables > Actions)
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          # Configuración de ejecución (puedes cambiar SHADOW a "0" cuando quieras operar en real)
          SHADOW: "1"
          DRY_RUN: "0"
          AVAX_TF: "1h"
          AVAX_NOTIONAL: "10.0"
          AVAX_MAX_NOTIONAL: "15.0"
          TZ: "Europe/Madrid"
        run: python avax-go.py

      - name: Guardar estado o cambios en el repositorio
        run: |
          git config user.name "el-aprendiz-bot"
          git config user.email "el-aprendiz-bot@users.noreply.github.com"

          # Comprobamos si se ha generado algún archivo de estado o registro relevante
          if [ -e "estado_avax" ]; then
            git add estado_avax
          fi
          
          # Añade aquí otros archivos de estado si tu script los genera en la raíz
          # git add estado_inj
          
          if ! git diff --cached --quiet; then
            git commit -m "estado AVAX $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash || true
            git push
          else
            echo "Sin cambios nuevos en archivos de estado."
          fi
