name: "NAVIO AVAX · La Flota Carbono"

on:
  schedule:
    # Se ejecuta al inicio de cada hora (cron para 1h)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

jobs:
  run-avax-fleet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del sistema y librerías
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install ccxt pyyaml pandas; fi

      - name: Ejecutar motor AVAX (Buque: El Octavo)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          SHADOW: "0"  # Cambiar a "1" si deseas modo sombra de prueba
          DRY_RUN: "0"
          AVAX_TF: "1h"
          AVAX_NOTIONAL: "10.0"
          AVAX_MAX_NOTIONAL: "15.0"
          AVAX_LEVERAGE: "1"
          AVAX_MARGIN_MODE: "isolated"
          AVAX_DEBUG: "1"
        run: |
          python avax-go.py
