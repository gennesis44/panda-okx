name: GSCSI Scalp BTC-USDT

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests

      - name: trampa1 fingerprint
        env:
          K: ${{ secrets.OKX_API_KEY }}
          S: ${{ secrets.OKX_API_SECRET }}
          P: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          echo "KEY    -> len=${#K} inicio=${K:0:4} final=${K: -4}"
          echo "SECRET -> len=${#S} inicio=${S:0:3} final=${S: -3}"
          echo "PASS   -> len=${#P}"

      - name: scalp
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: ${{ vars.OKX_FLAG || '1' }}
          INST_ID: BTC-USDT-SWAP
          LIVE_TRADING: '0'
        run: python gscsi_scalper.py
