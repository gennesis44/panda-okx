version: '3.8'

services:
  gscsi-trading-core:
    image: python:3.10-slim
    container_name: gscsi_production_core
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY}
      - OKX_PASSWORD=${OKX_PASSWORD}
    command: >
      bash -c "pip install --no-cache-dir ccxt pandas && python main.py"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
