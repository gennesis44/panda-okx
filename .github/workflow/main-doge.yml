# ==============================================================================
# CONFIGURACIÓN YAML — DOGE (AX2 / EL PERRO LEY V3.1) + VIGILANCIA INJ / SUI
# ==============================================================================

bot:
  name: "AX2-DOGE-EL-PERRO"
  version: "3.1"
  base_asset: "DOGE"
  host: "https://my.okx.com"
  test_mode: false
  single_cycle: false

exchange:
  id: "okx"
  default_type: "swap"
  enable_rate_limit: true
  settle_restriction: "USDT_FORBIDDEN" # Cumplimiento MiCA/EEE

trading_params:
  amount_contracts: 10
  leverage: 1
  td_mode: "cross"
  timeframe: "5m"
  ema_fast: 3
  ema_slow: 21
  max_notional_usd: 15.0
  cooldown_min: 60
  warmup_candles: 40

risk_management:
  long:
    sl_pct: 0.020  # 2.0%
    tp_pct: 0.040  # 4.0%
    rr_ratio: 2.0
    breakeven_target: 33.0
  short:
    sl_pct: 0.030  # 3.0%
    tp_pct: 0.040  # 4.0%
    rr_ratio: 1.33
    breakeven_target: 43.0
  candado_v2:
    min_separation_pct: 0.15  # Veto si EMA3 y EMA21 difieren menos de 0.15%
    fail_closed: true
  signal_window: [-2, -3, -4, -5, -6, -7, -8] # Cobertura cron real GitHub (~40 min)

defensive_safeguards:
  force_one_way_mode: true  # Ax4: Blindaje anti-hedge
  idempotency_check: true   # Ax3: clOrdId con prefijo DOGE + timestamp
  guard_notional: true      # Veto estricto si el nocional excede el límite

# ==============================================================================
# VIGILANCIA DE FLOTA SECUNDARIA: INJ & SUI
# Instrucción: Monitoreo activo para evaluar condiciones de orden de zarpar.
# ==============================================================================
fleet_watchtower:
  enabled: true
  assets:
    - symbol: "INJ/USD:USD"
      asset_name: "Injective"
      role: "Vigilante de Flota"
      trigger_condition: "Cruces de tendencia o ruptura de niveles clave en 5m/1h"
      action_on_signal: "Zarpar / Evaluar ejecución condicional de orden"
    - symbol: "SUI/USD:USD"
      asset_name: "Sui"
      role: "Vigilante de Flota"
      trigger_condition: "Cruces de tendencia o ruptura de niveles clave en 5m/1h"
      action_on_signal: "Zarpar / Evaluar ejecución condicional de orden"
  execution_mode: "standby_alert" # Alerta y validación de margen antes de liberar amarras
