name: EL TITAN · Navío ADA EMA 3/21 15m (LIVE)

on:
  schedule:
    # 15m timeframe: cada 15 min para no perder señales (2 velas de ventana)
    # AVISO: 96 runs/día = ~2880 min/mes. Si tu repo es privado y tienes
    # muchos bots, considera cambiar a '*/30' para ahorrar minutos.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Necesario para que el git push final funcione con el GITHUB_TOKEN por defecto
permissions:
  contents: write

jobs:
  run-ada-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_ada

      - name: Ejecutar Bot ADA (LIVE)
        env:
          OKX_API_KEY:         ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:        ${{ secrets.OKX_PASSWORD }}
          SHADOW:              '0'        # 0 = REAL (default flota)
          DRY_RUN:             '0'
          SINGLE_CYCLE:        '1'        # 1 ciclo y salir (GH Actions)
          ADA_TF:              '15m'      # decreto Capitán
          ADA_SEP_LOCK:        '0.15'     # auditado
          ADA_SL_FLOOR:        '2.0'      # SL fijo 2%
          ADA_SL_CAP:          '2.0'      # piso=techo = SL fijo
          ADA_TP_MULT:         '1.5'      # TP = 3%
          ADA_MAX_NOTIONAL:    '12.0'     # ajuste flota
          COOLDOWN_MIN:        '60'
        run: |
          python3 ada-main.py 2>&1 | tee logs_ada/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "El Titan Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git add logs_ada/ || true
          git commit -m "auto: log ADA EL TITAN [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
