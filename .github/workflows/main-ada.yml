name: ADA ALAS · EMA4/17 6H · swing
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: main-ada
  cancel-in-progress: false

jobs:
  nave:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SINGLE_CYCLE: '1'
      TEST_MODE: '1'
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
      OKX_ADA_MAX_NOTIONAL: '6.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt==4.5.90 pandas
      - run: python main-ada.py
