name: Atalaya.yml

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  vigia-catapulta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests

      - name: Run Atalaya Vigia & Catapult
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          LAUNCH_SHIPS: "DOGE,ADA,AVAX,HBAR,XLM,XRP,INJ,SUI"
        run: |
          python main-atalaya.py
