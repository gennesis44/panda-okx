name: bot-ema-okx

on:
  schedule:
    - cron: '*/15 * * * *'     # cada 15 min
  workflow_dispatch:           # lanzamiento manual para pruebas

concurrency:
  group: bot-ema-okx
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # MAPA UNICO DE CREDENCIALES (vale para TODOS los pasos)
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_API_SECRET }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSPHRASE }}
      SINGLE_CYCLE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -U "ccxt>=4.4.0" pandas

      - name: Sondeo de hosts OKX (cual reconoce la key)
        run: |
          python - <<'EOF'
          import ccxt, os
          creds = {
              'apiKey':    (os.getenv('OKX_API_KEY') or '').strip(),
              'secret':    (os.getenv('OKX_SECRET_KEY') or '').strip(),
              'password':  (os.getenv('OKX_PASSWORD') or '').strip(),
          }
          for host in ['https://www.okx.com', 'https://my.okx.com',
                       'https://aws.okx.com', 'https://www.okx.eu']:
              try:
                  ex = ccxt.okx({**creds, 'enableRateLimit': True,
                                 'options': {'defaultType': 'swap'},
                                 'urls': {'api': {'rest': host}}})
                  ex.private_get_account_balance()
                  print(f"EXITO: {host} reconoce la API key")
              except Exception as e:
                  print(f"{host} -> {str(e)[:100]}")
          EOF

      - name: Ejecutar ciclo del bot
        run: python bot.py
