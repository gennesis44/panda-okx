name: bot-ema-okx

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: bot-ema-okx
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -U ccxt pandas

      - name: Verificar credenciales OKX
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python - <<'EOF'
          import ccxt, os
          ex = ccxt.okx({
              'apiKey': os.getenv('OKX_API_KEY'),
              'secret': os.getenv('OKX_SECRET_KEY'),
              'password': os.getenv('OKX_PASSWORD'),
              'enableRateLimit': True,
              'options': {'defaultType': 'swap'},
          })
          bal = ex.fetch_balance()
          print(f"OK: Autenticacion correcta | USDT libre: {bal.get('USDT', {}).get('free')}")
          EOF

      - name: Ejecutar ciclo del bot
        env:
          SINGLE_CYCLE: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSPHRASE }}
        run: python bot.py
