name: INJ Bot OKX

on:
  schedule:
    - cron: '11,41 * * * *'   # cada 30 min — offsets no usados por la flota
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inj-bot
  cancel-in-progress: false

jobs:
  run-inj:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt pandas
      - name: Run INJ Bot
        run: python main-inj.py
        env:
          SINGLE_CYCLE: '1'
          PYTHONUNBUFFERED: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
