name: INJ Bot OKX

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: inj-bot-run
  cancel-in-progress: true

jobs:
  run-inj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar bot (1 ciclo)
        env:
          OKX_API_KEY:     ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:  ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:    ${{ secrets.OKX_PASSWORD }}
          DRY_RUN:         '1'
          SINGLE_RUN:      '1'
          TEST_ONLY:       '0'
          BOT_SYMBOL:      'INJ/USD:INJ'
          BOT_TIMEFRAME:   '15m'
          BOT_LEVERAGE:    '5'
          BOT_NOTIONAL:    '50'
          BOT_SL_PCT:      '1.0'
          BOT_TP_PCT:      '1.5'
          BOT_LOOP_SEC:    '900'
        run: python main-inj.py
