name: INJ Bot OKX

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: inj-bot-run
  cancel-in-progress: true

jobs:
  run-inj:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Ejecutar bot (1 ciclo)
        env:
          OKX_API_KEY:        ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:     ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:       ${{ secrets.OKX_PASSWORD }}
          
          # === Configuración EEE + INJ futuro USD ===
          OKX_REGION:         'eee'
          BOT_SYMBOL:         'INJ/USD:USD-310711'
          BOT_DEFAULT_TYPE:   'future'
          BOT_TICK_SIZE:      '0.001'
          
          # === Modos ===
          DRY_RUN:            '0'
          SINGLE_RUN:         '1'
          TEST_ONLY:          '0'
          
          # === Parámetros operativos ===
          BOT_TIMEFRAME:      '15m'
          BOT_LEVERAGE:       '2'
          BOT_NOTIONAL:       '12'
          BOT_SL_PCT:         '1.0'
          BOT_TP_PCT:         '1.5'
          BOT_LOOP_SEC:       '900'
        run: python main-inj.py
