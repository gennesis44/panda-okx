name: XPL Engine

on:
  workflow_dispatch:    # <--- Esto activa el botón "Run workflow"
  schedule:
    - cron: '*/30 * * * *' # Ajusta la frecuencia según lo necesites

jobs:
  ejecutar-xpl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install ccxt pyyaml

      - name: Ejecutar XPL
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: python xpl.py
