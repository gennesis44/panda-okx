name: GSCSI Trading Bot Production

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour (aligned with the 1H timeframe)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-trading-bot:
    name: Execute Trading Strategy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Run Trading Bot Script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: |
          python okx_trading_bot.py
