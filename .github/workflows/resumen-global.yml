steps:
  # 1. PRIMERO: Descargar el repositorio (indispensable para que encuentre los archivos)
  - name: Checkout repositorio
    uses: actions/checkout@v4

  # 2. SEGUNDO: Configurar Python y el caché de pip
  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'
      cache: 'pip' # Opcional: si no usas requirements.txt, puedes quitar esta línea para evitar el error de caché.

  # 3. TERCERO: Instalar dependencias (si tienes requirements.txt)
  - name: Instalar dependencias
    run: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

  # 4. CUARTO: Ejecutar tus scripts
  - name: Ejecutar script
    run: python contador_global.py
