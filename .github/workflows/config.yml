# =====================================================
#  Configuración backtest HBAR — OKX (EEE / MiCA)
#  IMPORTANTE: solo espacios, nunca tabuladores
# =====================================================

exchange:
  nombre: okx
  url_api: "https://www.okx.com"
  tipo: SPOT

par:
  base: HBAR
  quote_preferido: USDC     # USDT vetado en EEE. El script busca
                            # automático: HBAR-USDC, y si no existe
                            # prueba USD y el resto de pares HBAR.

backtest:
  timeframes: ["30m", "1H", "4H"]
  velas: 3000
  capital_por_operacion: 50.0
  comision: 0.001

estrategia:
  emas: [3, 4, 10, 21, 27]

salida:
  exportar_csv: true
  carpeta: resultados

riesgo:
  stop_loss_pct: null
  take_profit_pct: null
