# ============================================
# CONFIGURACIÓN GSCSI - EMA 3/21 4H OKX
# Colaborador y Protector del Operador
# ============================================
# ADVERTENCIA: Trading implica riesgo de pérdida total.
# Usa primero DEMO / TESTNET. Nunca pongas API con permisos de retiro.
# USDT vetado → Solo USD / USDC
# ============================================

exchange:
  id: "okx"                    # okx o myokx según región
  sandbox: true                # true = DEMO (recomendado). false = REAL (peligro)
  apiKey: "TU_API_KEY_AQUI"
  secret: "TU_SECRET_AQUI"
  password: "TU_PASSPHRASE_AQUI"   # passphrase de OKX

# Par de trading (solo USD / USDC)
symbol: "BTC/USDC"             # Alternativas: ETH/USDC, SOL/USDC, BTC/USD, etc.
timeframe: "4h"

# Estrategia EMA
ema_fast: 3
ema_slow: 21

# Gestión de riesgo (1x = sin apalancamiento extra)
leverage: 1
stop_loss_pct: 0.04            # 4%
take_profit_pct: 0.06          # 6%

# Tamaño de posición
position_size_usdc: 50         # Monto en USDC a usar por operación (ajusta)

# Comportamiento
force_entry_now: true          # true = ENTRADA YA MISMO (ignora señal EMA)
side: "buy"                    # "buy" (long) o "sell" (short) cuando force_entry_now=true
td_mode: "cash"                # "cash" = spot | "isolated" o "cross" = futuros
default_type: "spot"           # "spot" o "swap"

# Seguridad
max_daily_loss_pct: 0.10
check_interval_seconds: 300
