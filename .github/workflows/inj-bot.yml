# =====================================================================
# .github/workflows/inj-bot.yml — NAVIO INJ · EL INYECTOR · v3.1-prod
# Autonomo: inj_bot.py v3.1-prod (stdlib + ccxt). Host my.okx.com, XPERP USD,
# VETO USDT. Ciclo unico por ejecucion; idempotente por sello de vela.
#
# v3.1: ventana 0,-1,-2 (vela EN FORMACION + 2 cerradas) -> se vigila cada
# 15 min para captar el cruce temprano; 1x aislado; contrato minimo;
# SL/TP por ATR14 + estructura (R:R 1.5).
# FRENO: SHADOW '1' -> sombra | variable del repo DRY_RUN=1 -> fuerza sombra
# SECRETS: OKX_API_KEY, OKX_SECRET_KEY, OKX_PASSWORD (u OKX_PASSPHRASE)
# =====================================================================

name: inj-bot

on:
  schedule:
    - cron: '2,17,32,47 * * * *'   # cada 15 min (1h = '5 * * * *' si prefieres menos ruido)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inj-carbono
  cancel-in-progress: false

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arsenal (ccxt certificada)
        run: python -m pip install --quiet "ccxt==4.5.90"

      - name: Vigilia INJ — EL INYECTOR
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          SHADOW: '0'
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          INJ_TF: '1h'
          INJ_WINDOW: '0,-1,-2'       # 0 = vela en formacion, -1/-2 = cerradas
          INJ_EMA_FAST: '3'
          INJ_EMA_SLOW: '21'
          INJ_SEP_LOCK: '0.17'
          INJ_ATR_MULT: '1.3'         # SL = 1.3 x ATR14 (1h)
          INJ_SL_FLOOR: '1.5'
          INJ_SL_CAP: '3.0'
          INJ_TP_MULT: '1.5'          # R:R 1.5
          INJ_SIZE_MODE: 'min'        # contrato minimo
          INJ_MAX_NOTIONAL: '15'
          INJ_MAX_DRIFT: '1.0'
          INJ_LEVERAGE: '1'
          INJ_MARGIN_MODE: 'isolated'
          COOLDOWN_MIN: '60'
          INJ_DEBUG: '0'
        run: python inj_bot.py
