name: PANDA GSCSI Stats

on:
  schedule:
    - cron: "0 * * * *"   # una vez por hora — es solo lectura, no hace falta más frecuencia
  workflow_dispatch:        # también lo puedes lanzar a mano desde la pestaña Actions

concurrency:
  group: panda-gscsi-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas numpy python-dotenv

      - name: Run PANDA stats (track record real de OKX)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: "1"   # 1 = demo/simulated trading, igual que el bot principal
        run: python panda_gscsi_live.py --mode stats
