name: XRP Matrix Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xrp-matrix
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt pandas
      - name: Sondas exploradoras XRP-4H (6 combinaciones, solo lectura)
        run: python backtest-xrp-matrix.py
