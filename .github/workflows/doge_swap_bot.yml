# .github/workflows/bot.yml
name: OKX DOGE Swap Bot

on:
  schedule:
    # Se ejecuta a los 13, 28, 43 y 58 minutos de cada hora (2 minutos antes del cierre de cada vela de 15m)
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:        # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Run trading script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: |
          python bot_doge_swap.py
