# =====================================================================
# main-icp.yml — NAVIO ICP · LA FLOTA CARBONO · BUQUE: EL PORTAAVIONES
# .github/workflows/main-icp.yml
#
# 100% AUTONOMO: main-icp.py no necesita ningun otro archivo del repo.
# Este workflow solo instala la libreria ccxt (version certificada)
# y suelta el barco al mar cada 20 minutos.
#
# ESTADO: ARMADO — SHADOW: '0' -> municion real (decreto del capitan)
# FRENO:   volver a SHADOW: '1' -> sombra (bitacora de senales, sin municion)
# FRENO FLOTA: variable del repo DRY_RUN=1 -> fuerza sombra en todo
#
# SECRETS (REQUERIDOS en modo ARMADO — sin ellos, fail-closed, no zarpa):
#   OKX_API_KEY, OKX_SECRET_KEY, OKX_PASSWORD (u OKX_PASSPHRASE)
# =====================================================================

name: main-icp

on:
  schedule:
    - cron: '*/20 * * * *'   # 3 vigilias por hora (vela 1H -> 3 chequeos)
  workflow_dispatch:          # boton manual "Run workflow" para pruebas

permissions:
  contents: read

concurrency:
  group: icp-carbono          # una sola vigilia ICP a la vez, sin solapes
  cancel-in-progress: false   # buque armado: la vigilia NUNCA se aborta

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abordar el repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arsenal (ccxt version certificada en pruebas)
        run: python -m pip install --quiet "ccxt==4.5.90"

      - name: Vigilia ICP — El Portaaviones
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          SHADOW: '0'
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          ICP_CONTRACTS: '6'
        run: python main-icp.py
