name: DOGE-GO (EMA 5/21)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  doge:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet ccxt pandas

      - name: Run doge-go.py
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          TEST_MODE: "0"
          SINGLE_CYCLE: "1"
        run: python doge-go.py
