name: doge-.yml

on:
  schedule:
    # Ejecución periódica (cada 30 min para cubrir la ventana de cruce)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite disparo manual desde la interfaz de Actions

jobs:
  run-doge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Ejecutar main-doge.py
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          OKX_DOGE_MAX_NOTIONAL: '15.0'
          SINGLE_CYCLE: '1'
          TEST_MODE: '0'
        run: python main-doge.py
