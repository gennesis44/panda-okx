name: Bot DOGE

on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doge-bot
  cancel-in-progress: false

jobs:
  run-doge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run DOGE Bot
        run: python main-doge.py
        env:
          SINGLE_CYCLE: '1'
          PYTHONUNBUFFERED: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
