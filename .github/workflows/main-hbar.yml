name: HBAR DESTRUCTOR · v4.1 (LIVE)

on:
  schedule:
    # 30m timeframe: 1 run cada 30 min, justo tras cierre de vela
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Necesario para que el git push final funcione con el GITHUB_TOKEN por defecto
permissions:
  contents: write

jobs:
  run-hbar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_hbar

      - name: Ejecutar Bot HBAR (LIVE)
        env:
          OKX_API_KEY:         ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:        ${{ secrets.OKX_PASSWORD }}
          TEST_MODE:           '0'
          SINGLE_CYCLE:        '1'
          OKX_HBAR_MAX_NOTIONAL: '12.0'
        run: |
          python3 hbar-main.py 2>&1 | tee logs_hbar/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "El Destructor Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git add logs_hbar/ || true
          git commit -m "auto: log HBAR DESTRUCTOR [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
