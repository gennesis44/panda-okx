name: BTC MA Senales

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,5,9,13,17,21 * * *'

jobs:
  senales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install ccxt

      - name: Ejecutar señales MA
        run: python btc-ma.py 
