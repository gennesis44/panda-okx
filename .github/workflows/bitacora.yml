name: bitacora-capturas

on:
  workflow_dispatch: {}

jobs:
  bitacora:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ccxt
        run: pip install ccxt

      - name: Cuaderno de capturas (solo lectura, nunca opera)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: python bitacora_capturas.py 200
