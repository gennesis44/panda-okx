# CUADERNO DE CAPTURAS v3 · my.okx.com FUTURES->SWAP->sin tipo, reintentos, fills de respaldo
# Editar .github/workflows/bitacora.yml (lapiz) -> pegar -> Commit -> Run workflow -> leer log
# Al terminar: borrar este archivo. Solo lectura; nunca opera.

name: bitacora-capturas

on:
  workflow_dispatch: {}

jobs:
  bitacora:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ccxt
        run: pip install ccxt

      - name: Cuaderno de capturas
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: |
          cat > bitacora.py <<'PYEOF'
          import os, sys, time
          from datetime import datetime, timezone
          import ccxt

          LIMIT = "100"
          key = os.environ.get("OKX_API_KEY", "").strip()
          sec = os.environ.get("OKX_SECRET_KEY", "").strip()
          pwd = os.environ.get("OKX_PASSWORD", "").strip()
          print("=" * 66)
          print("CUADERNO DE CAPTURAS v3 -", datetime.now(timezone.utc).strftime("%d-%m-%Y %H:%M"), "UTC")
          print("=" * 66)
          if not (key and sec and pwd):
              print("Faltan secrets OKX en la repo"); sys.exit(1)

          def abrir(demo, host):
              ex = ccxt.okx({"apiKey": key, "secret": sec, "password": pwd,
                             "hostname": host,
                             "enableRateLimit": True, "options": {"defaultType": "swap"}})
              if demo:
                  ex.headers["x-simulated-trading"] = "1"
              return ex

          INTENTOS = [("my.okx.com", False, {"instType": "FUTURES", "limit": LIMIT}, "REAL my.okx.com FUTURES"),
                      ("my.okx.com", False, {"instType": "SWAP", "limit": LIMIT}, "REAL my.okx.com SWAP"),
                      ("my.okx.com", False, {"limit": LIMIT}, "REAL my.okx.com (sin tipo)"),
                      ("www.okx.com", False, {"instType": "SWAP", "limit": LIMIT}, "REAL www.okx.com SWAP")]
          hist, mundo, ultimo = None, None, None
          for host, demo, params, tag in INTENTOS:
              for t in (1, 2):
                  try:
                      hist = abrir(demo, host).fetch_positions_history(params)
                      mundo = tag
                      break
                  except Exception as e:
                      ultimo = e
                      print(f"  [i] {tag} t{t}: {type(e).__name__} :: {str(e)[:150]}")
                      time.sleep(1.5)
              if hist is not None:
                  break

          if hist is None:
              print("  -> positions-history no abrio; probando operaciones crudas (fills)...")
              for it in ("FUTURES", "SWAP"):
                  for t in (1, 2):
                      try:
                          fills = abrir(False, "my.okx.com").private_get_trade_fills_history(
                              {"instType": it, "limit": "100"}).get("data", [])
                          break
                      except Exception as e:
                          fills = None
                          print(f"  [i] fills {it} t{t}: {type(e).__name__} :: {str(e)[:150]}")
                          time.sleep(1.5)
                  if fills:
                      break
              if fills:
                  def uts(ms):
                      try: return datetime.fromtimestamp(int(ms) / 1000, tz=timezone.utc).strftime("%m-%d %H:%M:%S")
                      except Exception: return "?"
                  print()
                  print("MODO CRUDO: ultimas operaciones (lo mas nuevo primero). Cada presa = 2+ lineas.")
                  print("-" * 70)
                  print(f"{'HORA UTC':<15} {'NAVE':<6} {'DIR':<5} {'PRECIO':>10} {'TAM':>8} {'PNL':>9} {'COMISION':>9}")
                  tot = 0.0
                  for f in fills:
                      nav = str(f.get("instId", "?")).split("-")[0]
                      pnl = float(f.get("fillPnl") or 0)
                      fee = float(f.get("fee") or 0)
                      tot += pnl
                      print(f"{uts(f.get('fillTime')):<15} {nav:<6} {str(f.get('side', '?')):<5} "
                            f"{str(f.get('fillPx', '?')):>10} {str(f.get('fillSz', '?')):>8} {pnl:>+9.2f} {fee:>+9.4f}")
                  print("-" * 70)
                  print(f"PnL bruto de los cierres visibles (fills): {tot:+.2f} (comisiones aparte)")
                  sys.exit(0)
              print()
              print("[!] Ninguna puerta abrio. Ultimo error:", type(ultimo).__name__, "::", str(ultimo)[:200])
              sys.exit(1)

          print("MUNDO DE LA LLAVE:", mundo, "(cuenta SIMULADA)" if "DEMO" in mundo else "")

          def utc(ms):
              try: return datetime.fromtimestamp(int(ms) / 1000, tz=timezone.utc).strftime("%m-%d %H:%M")
              except Exception: return "?"

          rows = []
          for h in hist:
              g = lambda *ns, d=None: next((h[n] for n in ns if h.get(n) not in (None, "")), d)
              side = str(g("direction", "posSide", "?")).lower()
              rows.append({"cierre": utc(g("uTime", "closeTime")),
                           "nave": str(g("instId", "symbol", "?")).split("-")[0],
                           "dir": "LONG" if side.startswith("l") else "SHORT" if side.startswith("s") else "?",
                           "pnl": float(g("realizedPnl", 0) or 0),
                           "px": g("openAvgPx"), "px2": g("closeAvgPx")})

          rows.sort(key=lambda r: r["cierre"])
          if not rows:
              print("Cuaderno limpio: sin posiciones cerradas"); sys.exit(0)

          wins = [r for r in rows if r["pnl"] > 0]
          loss = [r for r in rows if r["pnl"] < 0]
          tot = sum(r["pnl"] for r in rows)
          wr = 100.0 * len(wins) / (len(wins) + len(loss)) if (wins or loss) else 0.0
          print()
          print("POSICIONES CERRADAS:", len(rows))
          print("-" * 66)
          print(f"{'CIERRE':<11} {'NAVE':<6} {'DIR':<6} {'ENTRADA':>10} {'SALIDA':>10} {'PNL':>9}")
          for r in rows:
              f = "+" if r["pnl"] > 0 else "-" if r["pnl"] < 0 else "="
              print(f"{r['cierre']:<11} {r['nave']:<6} {r['dir']:<6} {r['px'] or '?':>10} {r['px2'] or '?':>10} {f}{r['pnl']:>+8.2f}")
          print("-" * 66)
          print(f"ganadas {len(wins)} | perdidas {len(loss)} | winrate {wr:.1f}%")
          print(f"PnL total {tot:+.2f} | mejor {max(r['pnl'] for r in rows):+.2f} | peor {min(r['pnl'] for r in rows):+.2f}")
          streak, sgn = 0, 0
          for r in reversed(rows):
              if r["pnl"] == 0:
                  continue
              s = 1 if r["pnl"] > 0 else -1
              if sgn == 0:
                  sgn, streak = s, 1
              elif s == sgn:
                  streak += 1
              else:
                  break
          if streak:
              print(f"racha actual: {streak} {'ganada(s)' if sgn > 0 else 'perdida(s)'}")
          PYEOF
          python bitacora.py
