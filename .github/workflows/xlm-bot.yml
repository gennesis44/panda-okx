name: xlm-bot-okx

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Diagnostico XLM: catalogo + sonda 1 contrato (abrir y cerrar)'
        type: boolean
        required: false
        default: false

concurrency:
  group: xlm-bot-okx
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_API_SECRET }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSPHRASE }}
      SINGLE_CYCLE: '1'
      TEST_MODE: ${{ github.event.inputs.test_mode == 'true' && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostico raiz (VER QUE VE EL RUNNER - borrar cuando funcione)
        run: |
          echo "=== RAIZ DEL REPO ==="
          ls -la
          echo "=== Buscando xlm_bot.py en todo el repo ==="
          find . -name "*xlm*" -not -path "./.git/*"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -U "ccxt>=4.4.0" pandas

      - name: Ejecutar bot XLM
        run: python xlm_bot.py
