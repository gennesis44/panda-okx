name: XRP Bot OKX

on:
  schedule:
    - cron: '20 * * * *'   # cada hora — caza cierres de vela 4H
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xrp-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Shadow surf
        run: python main-xrp.py
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || (git commit -m "XRP shadow: ledger update" && git push)
