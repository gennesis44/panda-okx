# ============================================
# GSCSI · EMA 3/21 4H · Force Entry
# Colaborador y Protector del Operador
# Solo USDC / USD  |  USDT vetado
# ============================================

name: GSCSI EMA 3-21 4H

on:
  workflow_dispatch:          # Ejecución manual
  schedule:
    - cron: '0 */4 * * *'     # Cada 4 horas (alineado al TF)

env:
  PYTHON_VERSION: '3.11'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pyyaml pandas

      - name: Create config.yml
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          cat > config.yml << EOF
          # ============================================
          # CONFIGURACIÓN GSCSI - EMA 3/21 4H OKX
          # ============================================
          exchange:
            id: "okx"
            sandbox: true                # true = DEMO | false = REAL
            apiKey: "${{ secrets.OKX_API_KEY }}"
            secret: "${{ secrets.OKX_SECRET }}"
            password: "${{ secrets.OKX_PASSPHRASE }}"

          symbol: "BTC/USDC"             # Solo USDC / USD
          timeframe: "4h"

          ema_fast: 3
          ema_slow: 21

          leverage: 1
          stop_loss_pct: 0.04            # 4%
          take_profit_pct: 0.06          # 6%

          position_size_usdc: 50

          force_entry_now: true          # ENTRADA YA MISMO
          side: "buy"                    # buy o sell
          td_mode: "cash"
          default_type: "spot"

          max_daily_loss_pct: 0.10
          check_interval_seconds: 300
          EOF

      - name: Run EMA Bot
        run: |
          python ema_bot_okx.py

      - name: Upload logs (si existen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            *.log
            config.yml
          retention-days: 7
