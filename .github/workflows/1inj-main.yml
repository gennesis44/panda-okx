name: El Aprendiz - INJ EMA 4/21 (20m LIVE)

on:
  schedule:
    # Se dispara exactamente cada 20 minutos
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run-inj-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Ejecutar Bot INJ (LIVE)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          OKX_API_SECRET: ${{ secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_PASSWORD }}
          TEST_MODE: '0'
          SINGLE_CYCLE: '1'
        run: |
          python3 main-1inj.py

      - name: Commit y Push de Estado
        if: always()
        run: |
          git config --global user.name "El Aprendiz Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git status
          git add estado_inj/ || true
          git commit -m "auto: registro INJ EMA 4/21 [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
