name: 1inj=main.yml

on:
  schedule:
    # Se dispara cada 20 minutos (puede retrasarse 5-15 min por carga de GH Actions)
    - cron: '*/20 * * * *'
  workflow_dispatch:

# Necesario para que el git push final funcione con el GITHUB_TOKEN por defecto
permissions:
  contents: write

jobs:
  run-inj-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorio de logs
        run: mkdir -p logs_inj

      - name: Ejecutar Bot INJ (LIVE)
        env:
          OKX_API_KEY:         ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:        ${{ secrets.OKX_PASSWORD }}
          OKX_API_SECRET:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_API_PASSPHRASE:  ${{ secrets.OKX_PASSWORD }}
          OKX_INJ_MAX_NOTIONAL: '6.00'
          TEST_MODE: '0'
          SINGLE_CYCLE: '1'
        run: |
          python3 main-1inj.py 2>&1 | tee logs_inj/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "El Aprendiz Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git add logs_inj/ || true
          git commit -m "auto: log INJ EMA 4/21 [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
