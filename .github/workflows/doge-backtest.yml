# .github/workflows/doge-backtest.yml — DOGE Backtest · validador de la ley v2
name: DOGE Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest-doge.py'
      - '.github/workflows/doge-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install ccxt pandas numpy

      - name: Ejecutar validador DOGE
        run: python backtest-doge.py

      - name: Subir resultados (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-backtest-resultados
          path: backtest_results_doge.csv
          if-no-files-found: ignore
