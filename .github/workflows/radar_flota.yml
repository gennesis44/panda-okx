# radar_flota.yml — EL FARO · LA FLOTA CARBONO
# Ronda horaria: que hace toda la flota (capturando / buscando / botin)
name: radar-flota

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faro-carbono
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abordar el repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arsenal (ccxt version certificada en pruebas)
        run: python -m pip install --quiet "ccxt==4.5.90"

      - name: Ronda del FARO — flota completa
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          RADAR_SHIPS: 'ADA-USDT-SWAP:15m:0.15,INJ-USDT-SWAP:1h:0.17,XPL-USDT-SWAP:30m:0.15,XLM-USDT-SWAP:1h:0.15,ICP-USDT-SWAP:1h:0.15'
          RADAR_FILLS_H: '24'
          COOLDOWN_MIN: '60'
          RADAR_N_CANDLES: '40'
        run: python radar_flota.py
