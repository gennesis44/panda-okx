name: EL ATUNERO - XPL EMA 3/21 1H (SHADOW/LIVE)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-xpl-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_xpl

      - name: Ejecutar Bot EL ATUNERO (XPL)
        env:
          OKX_API_KEY:          ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:       ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:         ${{ secrets.OKX_PASSWORD }}
          OKX_XPL_MAX_NOTIONAL: '1500.0'   # Ajustado para permitir el nuevo nocional de 125 contratos (~$54 USD)
          XPL_CONTRACTS:        '125.0'  # Modificado a 125 contratos (1,250 XPL por entrada)
          OKX_LEVERAGE:         '1'
          SHADOW:               '1'   # Sombra activa (cambiar a '0' cuando se ordene fuego real)
        run: |
          python3 main-xpl.py 2
