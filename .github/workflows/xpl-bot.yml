name: EL ATUNERO - XPL EMA 3/21 1H 

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-xpl-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_xpl

      - name: Ejecutar Bot EL ATUNERO (XPL)
        env:
          OKX_API_KEY:          ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:       ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:         ${{ secrets.OKX_PASSWORD }}
          OKX_XPL_MAX_NOTIONAL: '50.0'    # Límite ajustado para ~$6-10 de nocional
          XPL_CONTRACTS:        '14.0'    # 14 contratos (~$6 USD de nocional)
          OKX_LEVERAGE:         '1'
          SHADOW:               '0'       # COMBATE REAL ACTIVO
        run: |
          python3 main-xpl.py 2>&1 | tee logs_xpl/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "El Atunero Bot"
          git config --global user.email "atunero@gscsi.trade"
          git add logs_xpl/ || true
          git commit -m "auto: log EL ATUNERO XPL (14 contratos - ~$6) [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
