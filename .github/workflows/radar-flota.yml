# =====================================================================
# radar_flota.yml — NAVIO RADAR · LA FLOTA CARBONO · BUQUE: EL FARO
# .github/workflows/radar_flota.yml
#
# Ronda periodica del faro: UN solo workflow para saber que anda haciendo
# TODA la flota — buscando o capturando, y a que distancia estan el perro
# (SL), la cajonera (TP) y los demas.
#
#   · CAPTURANDO  -> posicion abierta: lado, ct, entrada, px, uPnL,
#                    🐕 perro (SL) a X% | 🧰 cajonera (TP) a Y%
#                    (captura sin coraza -> ALARMA en el log)
#   · BUSCANDO    -> naves del registro sin posicion: stance EMA3/21,
#                    sep vs su candado (a cuantos puntos de disparar),
#                    cruces en las ultimas 4 velas cerradas
#   · LOS DEMAS   -> capturas de instrumentos no declarados: tambien alumbra
#   · BOTIN 24h   -> PnL realizado por nave + calmas del perro Ax
#
# EL FARO NO LLEVA MUNICION: solo endpoints de LECTURA (balance, posiciones,
# algos pendientes, fills, velas publicas). Jamas envia ordenes.
#
# SIN CREDENCIALES: modo faro publico (solo BUSCANDO) — no zarpa rojo.
#
# REGISTRO DE NAVES (RADAR_SHIPS = instId:bar:lock, ...):
#   ADA 15m 0.15 (TITAN) | INJ 1h 0.17 (INYECTOR) | XPL 30m 0.15
#   Anade las demas naves de la panda-okx (ICP, etc.) en la linea de abajo.
#   Fuente de precio: swaps USDT publicos como proxy (metodo de flota,
#   difiere del XPERP USD solo en basis).
# =====================================================================

name: radar-flota

on:
  schedule:
    - cron: '7 * * * *'       # ronda horaria del faro (:07, tras la vigilia INJ de :05)
    # - cron: '*/30 * * * *'  # opcion ronda cada 30 min (gasta minutos: ~x2)
  workflow_dispatch:          # boton manual "Run workflow" — ping al sonar cuando quieras

permissions:
  contents: read

concurrency:
  group: faro-carbono         # una sola ronda del faro a la vez
  cancel-in-progress: false

jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abordar el repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arsenal (ccxt version certificada en pruebas)
        run: python -m pip install --quiet "ccxt==4.5.90"

      - name: Ronda del FARO — flota completa
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          RADAR_SHIPS: 'ADA-USDT-SWAP:15m:0.15,INJ-USDT-SWAP:1h:0.17,XPL-USDT-SWAP:30m:0.15'
          # RADAR_SHIPS: 'ADA-USDT-SWAP:15m:0.15,INJ-USDT-SWAP:1h:0.17,XPL-USDT-SWAP:30m:0.15,ICP-USDT-SWAP:1h:0.20'
          RADAR_FILLS_H: '24'         # ventana del botin (horas)
          COOLDOWN_MIN: '60'          # calma del perro Ax (igual que las naves)
          RADAR_N_CANDLES: '40'       # velas cerradas para el radar de senales
        run: python radar_flota.py
