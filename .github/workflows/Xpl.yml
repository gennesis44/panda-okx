# xpl.yml — EL ATUNERO · Motor del ciclo autónomo XPL
# ESTADO: ARMADO — SHADOW: '0' -> munición real
# FRENO:   volver a SHADOW: '1' -> sombra (bitácora sin disparar)

name: XPL Atunero Fleet Cycle

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: # Habilita el botón manual en la web de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Run XPL Trading Script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          # ARMADO por decreto: '0' = munición real. Freno: volver a '1'.
          SHADOW: '0'
        run: |
          python main-xpl.py
