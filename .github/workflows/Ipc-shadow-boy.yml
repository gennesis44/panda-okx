name: ICP Shadow Bot (OKX EEE)

on:
  schedule:
    # Se ejecuta cada 20 minutos (compatible con CYCLE_SECONDS = 1200)
    - cron: '*/20 * * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-shadow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Run ICP shadow script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          OKX_HOSTNAME: ${{ secrets.OKX_HOSTNAME }}
          ICP_SYMBOL: ${{ secrets.ICP_SYMBOL }}
          ICP_RISK_PCT: ${{ secrets.ICP_RISK_PCT }}
          ICP_SL_ATR: ${{ secrets.ICP_SL_ATR }}
          ICP_TP_ATR: ${{ secrets.ICP_TP_ATR }}
        run: |
          python icp.py
