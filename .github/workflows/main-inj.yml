name: INJ Bot Execution (1H)
​on:
schedule:
# Ejecución cada hora a minuto 0
- cron: '0 * * * *'
workflow_dispatch:
inputs:
dry_run:
description: 'Modo Dry-Run (1=Sí, 0=No)'
required: false
default: '0'
​jobs:
trade:
name: Run INJ Trading Strategy (1H)
runs-on: ubuntu-latest
​steps:
- name: Checkout Repository
uses: actions/checkout@v4
​- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
cache: 'pip'
​- name: Install Dependencies
run: |
python -m pip install --upgrade pip
pip install ccxt pandas
​- name: Execute Trading Cycle
env:
OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
​# Parámetros ajustados a 1H
BOT_SYMBOL: "INJ/USD:USD-310711"
BOT_TIMEFRAME: "1h"
BOT_LEVERAGE: "2"
BOT_NOTIONAL: "12"
BOT_SL_PCT: "1.0"
BOT_TP_PCT: "1.5"
BOT_DEFAULT_TYPE: "future"
OKX_REGION: "global"
​SINGLE_RUN: "1"
DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
run: |
python inj_bot.py
