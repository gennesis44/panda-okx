name: inj-main

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada hora, alineado con la temporalidad de 1H
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  run-inj-bot:
    name: Execute INJ Trading Strategy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ccxt pandas

      - name: Run INJ Trading Bot Script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: |
          python inj_trading_bot.py
