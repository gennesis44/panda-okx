# =====================================================================
# main-inj.yml — NAVIO INJ · LA FLOTA CARBONO
# .github/workflows/main-inj.yml
#
# LIBERACION DEL ATALAYA: el casco main-inj.py ya navega solo.
# (Diagnostico del error grave: el casco lee SINGLE_RUN; Atalaya lo
#  catapultaba con SINGLE_CYCLE=1 -> el bucle ignoraba la orden y moria
#  a los 300s en cada ronda. Con workflow propio: una vela 15m = una
#  vigilia, y SINGLE_RUN=1 garantiza salida limpia.)
#
# LEY PROPIA DEL CASCO (canon: destructores con leyes propias — no se
# toca desde fuera):
#   EMA 7/21 · 15m · SOLO LONG (golden cross) · SL 1.0% / TP 1.5%
#   2x aislado (max EEE retail) · nocional $12 · idempotencia clOrdId
#   por vela · recorte de vela abierta (anti falso cruce) · cooldown 60m
#
# AXIOMA 2 RIGUROSO — sombra antes que municion:
#   TEST_ONLY: '1'  -> bitacora de senales, CERO ordenes.
#   ARMADO:         TEST_ONLY: '1' -> '0' a decreto del capitan.
#   (JAMAS usar DRY_RUN=1: activa el sandbox demo de OKX y las claves
#    reales de la flota no valen ahi — mina confirmada en el casco.)
#
# SECRETS: OKX_API_KEY, OKX_SECRET_KEY, OKX_PASSWORD (u OKX_PASSPHRASE)
# =====================================================================

name: main-inj

on:
  schedule:
    - cron: '*/15 * * * *'   # una vigilia por vela 15m (ley del casco)
  workflow_dispatch:          # boton manual "Run workflow" para pruebas

permissions:
  contents: read

concurrency:
  group: inj-carbono          # una sola vigilia INJ a la vez, sin solapes
  cancel-in-progress: false   # buque liberado: la vigilia NUNCA se aborta

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abordar el repo
        uses: actions/checkout@v4

      - name: Python 3.10 (ambiente de nacimiento del casco)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Arsenal (ccxt certificada + pandas)
        run: python -m pip install --quiet "ccxt==4.5.90" pandas

      - name: Vigilia INJ — sombra (Axioma 2)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          OKX_REGION: 'eee'     # my.okx.com — anclaje EEE de la flota (Ax3)
          SINGLE_RUN: '1'       # una vigilia = un ciclo y salida limpia
          TEST_ONLY: '1'        # AXIOMA 2: sombra, cero municion
          DRY_RUN: '0'          # JAMAS '1': sandbox demo no es la flota
        run: python main-inj.py
