name: PANDA GSCSI dual engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | trade | stats"
        required: true
        default: inspect
  schedule:
    - cron: "7,22,37,52 * * * *"   # ~15 min - inspect / scalp window
    - cron: "11 */2 * * *"         # every 2h - slower trade pass

permissions:
  contents: write

jobs:
  inspect:
    if: github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: panda-gscsi-inspect
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install --quiet numpy pandas requests python-dotenv
      - name: inspect
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: ${{ vars.OKX_FLAG || '1' }}
          ACCOUNT_EQUITY_USDT: ${{ vars.ACCOUNT_EQUITY_USDT || '10000' }}
          RISK_PER_TRADE_PCT: "1.0"
          LIVE_TRADING: "false"
          ENABLE_SCALP_SHORT: ${{ vars.ENABLE_SCALP_SHORT || 'true' }}
          ENABLE_REGIME_LONG: ${{ vars.ENABLE_REGIME_LONG || 'true' }}
          WEEKLY_LONG_MODE: ${{ vars.WEEKLY_LONG_MODE || 'full_pack' }}
          STOP_PCT: "0.01"
          LONG_TP_PCT: "0.015"
          SHORT_STOP_PCT: "0.01"
          SHORT_TP_PCT: "0.015"
          MAX_SCALP_SHORTS_PER_DAY: "4"
          SHORT_COOLDOWN_MIN: "45"
          BLOCK_SHORT_IN_4H_SQUEEZE: "true"
          ENABLE_ANALYSIS_LONG: ${{ vars.ENABLE_ANALYSIS_LONG || 'true' }}
          ANALYSIS_LONG_STOP_PCT: "0.01"
          ANALYSIS_LONG_TP_PCT: "0.02"
          MAX_ANALYSIS_LONGS_PER_DAY: "3"
          ANALYSIS_LONG_COOLDOWN_MIN: "60"
          ANALYSIS_LONG_REQUIRE_4H_EMA200: ${{ vars.ANALYSIS_LONG_REQUIRE_4H_EMA200 || 'true' }}
          MAX_DAILY_LOSS_PCT: "0.04"
        run: python panda_gscsi_live.py --mode inspect
      # FIX operador 2026-08-28: sin este paso, signals_log.json y
      # daily_state.json se pierden en cada ejecucion (runner efimero).
      # El winrate acumulado y el limite de shorts/dia dependen de esto.
      - name: Commit signals + daily state
        if: always()
        run: |
          git config user.name "panda-gscsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals_log.json daily_state.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: update signals_log.json + daily_state.json [skip ci]"
            git push
          fi

  trade_probe:
    if: github.event_name == 'schedule' && github.event.schedule == '11 */2 * * *' || github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'trade'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: panda-gscsi-trade
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install --quiet numpy pandas requests python-dotenv
      - name: trade (demo unless LIVE_TRADING secret/var is true)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: ${{ vars.OKX_FLAG || '1' }}
          ACCOUNT_EQUITY_USDT: ${{ vars.ACCOUNT_EQUITY_USDT || '10000' }}
          RISK_PER_TRADE_PCT: "1.0"
          LIVE_TRADING: ${{ vars.LIVE_TRADING || 'false' }}
          ENABLE_SCALP_SHORT: ${{ vars.ENABLE_SCALP_SHORT || 'true' }}
          ENABLE_REGIME_LONG: ${{ vars.ENABLE_REGIME_LONG || 'true' }}
          WEEKLY_LONG_MODE: ${{ vars.WEEKLY_LONG_MODE || 'full_pack' }}
          STOP_PCT: "0.01"
          LONG_TP_PCT: "0.015"
          SHORT_STOP_PCT: "0.01"
          SHORT_TP_PCT: "0.015"
          MAX_SCALP_SHORTS_PER_DAY: "4"
          SHORT_COOLDOWN_MIN: "45"
          BLOCK_SHORT_IN_4H_SQUEEZE: "true"
          ENABLE_ANALYSIS_LONG: ${{ vars.ENABLE_ANALYSIS_LONG || 'true' }}
          ANALYSIS_LONG_STOP_PCT: "0.01"
          ANALYSIS_LONG_TP_PCT: "0.02"
          MAX_ANALYSIS_LONGS_PER_DAY: "3"
          ANALYSIS_LONG_COOLDOWN_MIN: "60"
          ANALYSIS_LONG_REQUIRE_4H_EMA200: ${{ vars.ANALYSIS_LONG_REQUIRE_4H_EMA200 || 'true' }}
          MAX_DAILY_LOSS_PCT: "0.04"
        run: python panda_gscsi_live.py --mode trade
      - name: Commit signals + daily state
        if: always()
        run: |
          git config user.name "panda-gscsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals_log.json daily_state.json
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
          else
            git commit -m "chore: update signals_log.json + daily_state.json [skip ci]"
            git push
          fi

  stats:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'stats'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: pip install --quiet numpy pandas requests python-dotenv
      - name: stats
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: ${{ vars.OKX_FLAG || '1' }}
        run: python panda_gscsi_live.py --mode stats
