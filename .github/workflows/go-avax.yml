# go-avax.yml — NAVIO AVAX · LA FLOTA CARBONO · BUQUE: EL OCTAVO
# .github/workflows/go-avax.yml
#
# REBAUTIZO 07-11-2026: mismo casco certificado 35/35 (avax_bot.py v2.2),
# nuevo pabellon: avax-go.py + go-avax.yml. Cero cambios de logica.
# AL ZARPAR: borrar el viejo avax-bot.yml del repo (un solo pabellon AVAX).
#
# 100% AUTONOMO: avax-go.py v2.2-soldaduras-avax no necesita ningun otro
# archivo del repo (sin pandas — hallazgo P0 del doctorado). Este workflow
# instala ccxt version certificada y suelta el barco cada hora (vela 1h ->
# chequeo por vela). Vigilia a :10 (la 1h cierra a las :00; el INYECTOR
# vigila a :05 — la flota entra escalonada, sin solapes).
#
# CAMBIO v2.2 (05-11-2026) — DOCTORADO EN TRADING Y FORENSE, soldaduras
# certificadas en el bot:
#   P0 · cooldown FAIL-OPEN del Ax2 (leia fill.get('pnl'), campo inexistente
#        -> tras perder volvia a disparar = peaje oculto) -> DOBLE FUENTE
#        (positions-history -> fills-history -> bloqueo fail-closed).
#   P1 · SL 4.0/TP 5.5 (validados para EMA8/34, NO para 3/21) -> SL 2.0%
#        / TP 3.0% con candado 0.17 (motor auditado de flota; WR equilibrio
#        40.0%).
#   P1 · set_position_mode ELIMINADO: posMode se COMPRUEBA (net_mode),
#        jamas se muta la cuenta.
#   NUEVO · TELEMETRIA WIN RATE: cada vigilia imprime la bitacora WIN RATE
#        (WR neto con peaje incluido, net acumulado, peaje acumulado,
#        expectancia $/trade y WR equilibrio 40.0%). Es BITACORA: nunca
#        bloquea ni dispara.
#
# SIZING XPERP (fichaje 05-11-2026, precio ~8.67):
#   1 ct = 10 AVAX = ~$86.7 -> ticket objetivo $10 talla al MINIMO tradable
#   0.1 ct = ~$8.7 | margen 2x aislado ~$4.3 | SL 2% ~ -$0.17 | TP 3% ~ +$0.26
#   racha adversa 10 SL ~ -$1.7 | guardia $15 fail-closed (Ax3.2)
#
# ESTADO: ARMADO — SHADOW: '0' -> municion real
# FRENO:   volver a SHADOW: '1' -> sombra (bitacora de senales, sin municion)
# FRENO FLOTA: variable del repo DRY_RUN=1 -> fuerza sombra en toda la flota
#
# SECRETS (REQUERIDOS en modo ARMADO — sin ellos, fail-closed, no zarpa):
#   OKX_API_KEY, OKX_SECRET_KEY, OKX_PASSWORD (u OKX_PASSPHRASE)
# =====================================================================

name: go-avax

on:
  schedule:
    - cron: '10 * * * *'      # vigilia horaria (vela 1h cierra a las :00)
  workflow_dispatch:          # boton manual "Run workflow" para pruebas

permissions:
  contents: read

concurrency:
  group: avax-carbono         # una sola vigilia AVAX a la vez, sin solapes
  cancel-in-progress: false   # buque armado: la vigilia NUNCA se aborta

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abordar el repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arsenal (ccxt version certificada en pruebas)
        run: python -m pip install --quiet "ccxt==4.5.90"

      - name: Vigilia AVAX — EL OCTAVO
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          SHADOW: '0'
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          AVAX_TF: '1h'               # marco del capitan
          AVAX_WINDOW: '-2,-3,-4'     # ventana del cruce (capitan)
          AVAX_SEP_LOCK: '0.17'       # candado del capitan (el cruce NO basta)
          AVAX_SL_FLOOR: '2.0'        # SL fijo 2.0% (calibracion de flota 1h)
          AVAX_SL_CAP: '2.0'          # piso = techo -> SL fijo
          AVAX_TP_MULT: '1.5'         # TP = 3.0% (R:R 1.5)
          AVAX_NOTIONAL: '10'         # nocional objetivo $ (talla al minimo 0.1 ct)
          AVAX_MAX_NOTIONAL: '15'     # guardia de nocional $ (Ax3.2)
          AVAX_LEVERAGE: '2'          # apalancamiento
          AVAX_MARGIN_MODE: 'isolated' # margen aislado (Ax3)
          COOLDOWN_MIN: '60'          # calma tras perdida (fail-closed, doble fuente)
          AVAX_DEBUG: '0'             # '1' solo en diagnostico puntual: imprime colateral
        run: python avax-go.py
