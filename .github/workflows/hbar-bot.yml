# .github/workflows/hbar-bot-okx.yml — HBAR Bot OKX · DESTRUCTOR v3
#   Cron cada 20 min: la ventana de senal (-2/-3/-4) exige esa frecuencia
#   para no perder formaciones de stack en velas 30m
name: HBAR Bot OKX

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
  push:
    paths:
      - 'bot_hbar.py'
      - '.github/workflows/hbar-bot-okx.yml'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
      SINGLE_CYCLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install ccxt pandas

      - name: Ejecutar ciclo HBAR DESTRUCTOR v3
        run: python bot_hbar.py
