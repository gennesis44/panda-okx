name: sui-aprendiz (PROD)

# EL APRENDIZ — sui_bot.py v2.0 — TEST / PREVUELA / LIVE
# IGNICION (Settings > Secrets and variables > Actions):
#   1) Secretos: OKX_API_KEY, OKX_API_SECRET, OKX_API_PASSPHRASE  (clave de trading, jamas imprimirla)
#   2) Variable de repo SUI_MODE:
#        TEST     papel (sin secretos)
#        PREVUELA autentica y arma la orden, NO la envia (prueba de llaves)  <-- DEFAULT
#        LIVE     PRODUCCION: ordenes reales 1 ct / 1x / 1 parte, SL/TP vendidos al exchange
#   Opcionales: SUI_SIZE_CT (cap 5), SUI_LEV (cap 20), SUI_TD_MODE (isolated|cross)
# KILL-SWITCH: crea el archivo estado_sui/STOP en el repo y ninguna entrada sale.

on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch: {}   # boton manual (preVuela recomendada antes de LIVE)

permissions:
  contents: write         # anota el libro (estado_sui/) en el repo

concurrency:
  group: sui-aprendiz
  cancel-in-progress: false

jobs:
  nave:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Amarrar el repo
        uses: actions/checkout@v4

      - name: Izar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zarpar
        env:
          TZ: UTC
          SUI_MODE: ${{ vars.SUI_MODE || 'PREVUELA' }}
          SUI_SIZE_CT: ${{ vars.SUI_SIZE_CT || '1' }}
          SUI_LEV: ${{ vars.SUI_LEV || '1' }}
          SUI_TD_MODE: ${{ vars.SUI_TD_MODE || 'isolated' }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
        run: python sui_bot.py

      - name: Anotar el libro en el repo
        run: |
          git config user.name "sui-aprendiz[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add estado_sui/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Libro sin cambios"
          else
            git commit -m "sui: libro de partes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash || true
            git push
          fi
