name: Grid Shadow Lab

on:
  schedule:
    - cron: '35 * * * *'   # cada hora — velas 5m nuevas acumuladas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grid-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas numpy
      - name: Laboratorio de mallas
        run: python grid-shadow.py
      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || (git commit -m "Grid shadow: ledger" && git push)
