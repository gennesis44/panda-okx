name: atalaya-main
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt pandas requests
      - name: EL VIGIA - vigilancia + catapulta directa de la flota
        run: python main-atalaya.py
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          LAUNCH_SHIPS: "DOGE,ADA,AVAX,HBAR,XLM,XRP,INJ,SUI"
          # Candado de regimen BTC 7d ACTIVO (nadie zarpa con BTC en rango).
          # Para zarpe libre: descomenta la linea de abajo
          # ATALAYA_GATE: "0"
