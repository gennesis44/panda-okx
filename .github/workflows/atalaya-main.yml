name: atalaya-main
on:
  workflow_dispatch:
#  schedule:
#    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minures: 5
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt pandas
      - run: python atalaya.py
