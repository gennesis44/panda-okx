name: AVAX Backtest

on:
  workflow_dispatch: {}

jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - run: python backtest-avax.py
