name: AVAX v2 · validador de ley (solo lectura, sin claves)
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Anios de historia 1H'
        default: '2'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt==4.5.90 pandas==2.2.3 numpy
      - run: python backtest-avax-v2.py --years ${{ github.event.inputs.years }} | tee avax_resumen.txt
      - uses: actions/upload-artifact@v4
        with:
          name: avax-validacion
          path: |
            avax_resumen.txt
            avax_grid.csv
