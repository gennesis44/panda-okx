# ys.yml — CATAPULTA DIRECTA DEL ATALAYA (decreto Carbono v4) — parche firma 20-oct
#   ESTE ARCHIVO REEMPLAZA COMPLETO a .github/workflows/atalaya-main.yml
#   Cambios de la firma 20-oct (unicos, el atalaya en si NO SE TOCA):
#     LAUNCH_SHIPS: las naves BIEN (DOGE,XLM,NEAR,XPL) + INJ y SUI
#       (decreto: "Atalaya.py tambien hace salir a inj y sui y toda la
#       flota"). Sus cascos main-inj.py / main-sui.py viven en raiz:
#       si el Vigia canta, zarpan con la flota. Y si YA estan cazando
#       (posicion abierta), el propio vigia los salta: "YA EN LA MAR"
#       — ni los invoca (freno de fabrica en main-atalaya.py v4).
#     main-inj.py comercia el X-Perp INJ-USD_UM_XPERP-310711 (settle
#       USD, vivo, el "INJUSD UM (X-Perp)" de la app); main-sui.py
#       resuelve su instrumento del catalogo (SUI familia USD).
#     OKX_REGION=eee: los cascos ccxt van a my.okx.com (región EEE).
#     Los expulsados (ADA,AVAX,HBAR,XRP) ya no reciben zarpe jamas.
#   EL PERRO NO VA AQUI: DOGE va SUELTO con SU latido propio (doge.yml)
#   y SU doble tarea (huesos + zarpes INJ/SUI). No espera ni compite:
#   la presa se comparte, el mando no.
#   La atalaya en si NO SE TOCA: main-atalaya.py queda intacto.
name: ys
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt pandas requests
      - name: Vigia + Catapulta directa
        run: python main-atalaya.py
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          LAUNCH_SHIPS: "DOGE,XLM,NEAR,XPL,INJ,SUI"  # <<< NUEVO (PASO 3)
          OKX_REGION: "eee"                          # cascos ccxt -> my.okx.com (EEE)
          # El Perro no va aqui: DOGE es libre, tiene SU doge.yml
