name: FET Bot OKX

on:
  schedule:
    - cron: '*/4 * * * *'   # cada 4 min — cadencia del decreto Ax3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fet-bot
  cancel-in-progress: false

jobs:
  run-fet:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt pandas
      - name: Run FET Bot
        run: python main-fet.py
        env:
          SINGLE_CYCLE: '1'
          PYTHONUNBUFFERED: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
