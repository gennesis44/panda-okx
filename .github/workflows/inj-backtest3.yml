name: INJ Backtest v3

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest-inj3.py'
      - '.github/workflows/inj-backtest3.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas numpy

      - name: Ejecutar cuchillo profundo INJ
        run: python backtest-inj3.py
