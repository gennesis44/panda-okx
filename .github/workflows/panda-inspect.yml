name: PANDA GSCSI Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy python-dotenv
      - name: Run PANDA Inspect
        env:
          ACCOUNT_EQUITY_USDT: "10000"
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: "1"
        run: python panda_gscsi_live.py --interval 30 --max-minutes 1
