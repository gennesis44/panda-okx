name: El Perro - DOGE EMA 3/21 (1H LIVE)

on:
  schedule:
    # 1 vez por hora, justo tras el cierre de vela 1H
    # (GH Actions se retrasa 5-15 min en horas pico, así que captura bien el cierre)
    - cron: '0 * * * *'
  workflow_dispatch:

# Necesario para que el git push final funcione con el GITHUB_TOKEN por defecto
permissions:
  contents: write

jobs:
  run-doge-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_doge

      - name: Ejecutar Bot DOGE (LIVE)
        env:
          OKX_API_KEY:         ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:        ${{ secrets.OKX_PASSWORD }}
          TEST_MODE:           '0'        # v3.4: forma canónica — '0' = REAL
          SINGLE_CYCLE:        '1'        # 1 ciclo y salir (modo GitHub Actions)
          OKX_DOGE_MAX_NOTIONAL: '12.0'
        run: |
          python3 doge-main.py 2>&1 | tee logs_doge/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "El Perro Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git add logs_doge/ || true
          git commit -m "auto: log DOGE EMA 3/21 [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
