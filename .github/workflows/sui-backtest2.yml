name: SUI Backtest v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'backtest-sui2.py'
      - '.github/workflows/sui-backtest2.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas numpy

      - name: Ejecutar validador SUI v2
        run: python backtest-sui2.py
