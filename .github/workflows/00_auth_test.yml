name: 00 AUTH TEST

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: huella
        env:
          K: ${{ secrets.OKX_API_KEY }}
          S: ${{ secrets.OKX_API_SECRET }}
          P: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          echo "KEY    -> len=${#K} inicio=${K:0:4} final=${K: -4}"
          echo "SECRET -> len=${#S}"
          echo "PASS   -> len=${#P}"

      - name: auth OKX
        env:
          K: ${{ secrets.OKX_API_KEY }}
          S: ${{ secrets.OKX_API_SECRET }}
          P: ${{ secrets.OKX_PASSPHRASE }}
        run: |
          python3 - <<'EOF'
          import base64, hashlib, hmac, os, urllib.request, urllib.error
          from datetime import datetime, timezone
          k, s, p = os.environ['K'], os.environ['S'], os.environ['P']
          t = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f')[:-3] + 'Z'
          msg = t + 'GET' + '/api/v5/account/balance'
          sig = base64.b64encode(hmac.new(s.encode(), msg.encode(), hashlib.sha256).digest()).decode()
          req = urllib.request.Request('https://www.okx.com/api/v5/account/balance')
          req.add_header('OK-ACCESS-KEY', k)
          req.add_header('OK-ACCESS-SIGN', sig)
          req.add_header('OK-ACCESS-TIMESTAMP', t)
          req.add_header('OK-ACCESS-PASSPHRASE', p)
          try:
              r = urllib.request.urlopen(req, timeout=20)
              print('HTTP', r.status, '->', r.read().decode()[:200])
          except urllib.error.HTTPError as e:
              print('HTTP', e.code, '->', e.read().decode()[:200])
          EOF
