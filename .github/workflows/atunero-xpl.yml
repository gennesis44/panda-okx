name: EL ATUNERO · Nave Autónoma XPL

on:
  schedule:
    # Ejecución cada 30 minutos (evalúa exclusivamente velas 1H cerradas)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      shadow_mode: '0'
        description: 'Modo de Ejecución (0 = PRODUCCIÓN REAL, 1 = Sombra / Prueba)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

concurrency:
  group: atunero-xpl-ciclo
  cancel-in-progress: false

jobs:
  zarpar-xpl:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias (ccxt, pandas)
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Ejecutar Nave Autónoma XPL (main-xpl.py)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          # NAVE ARMADA EN PRODUCCIÓN ('0' = REAL). Usar '1' solo para pruebas en sombra.
          SHADOW: ${{ github.event.inputs.shadow_mode || '0' }}
          # Parámetros opcionales (descomentar si deseas sobreescribir los valores por defecto del script)
          # XPL_CONTRACTS: '25'
          # OKX_XPL_MAX_NOTIONAL: '300'
          # OKX_LEVERAGE: '3'
        run: python main-xpl.py
