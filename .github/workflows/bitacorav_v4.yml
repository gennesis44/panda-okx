# BITACORA v4 · ficha sola: posiciones, winrate, rachas y neto tras comisiones
# Editar .github/workflows/bitacora.yml (lapiz) -> pegar -> Commit -> Run workflow -> leer log
# Al terminar: borrar el archivo Y el run (la repo es publica). Solo lectura; nunca opera.

name: bitacora-capturas

on:
  workflow_dispatch: {}

jobs:
  bitacora:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ccxt
        run: pip install ccxt

      - name: Cuaderno fichado
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: |
          cat > bitacora.py <<'PYEOF'
          import os, sys
          from datetime import datetime, timezone
          import ccxt

          LIMIT = "100"
          PAGINAS = 3
          key = os.environ.get("OKX_API_KEY", "").strip()
          sec = os.environ.get("OKX_SECRET_KEY", "").strip()
          pwd = os.environ.get("OKX_PASSWORD", "").strip()

          def fnum(x):
              try: return float(x)
              except Exception: return 0.0

          def pxx(x):
              try:
                  s = f"{float(x):.6f}".rstrip("0").rstrip(".")
                  return s if s else "0"
              except Exception: return str(x)

          def utc(ms):
              try: return datetime.fromtimestamp(int(ms) / 1000, tz=timezone.utc).strftime("%d-%m %H:%M")
              except Exception: return "?"

          def ts_de(x):
              return int(x.get("ts") or x.get("fillTime") or 0)

          def abrir():
              return ccxt.okx({"apiKey": key, "secret": sec, "password": pwd,
                               "hostname": "my.okx.com", "enableRateLimit": True})

          def dir_de(posSide, side):
              ps = str(posSide or "").lower()
              if ps in ("long", "short"):
                  return "LARGA" if ps == "long" else "CORTA"
              sd = str(side or "").lower()
              return "LARGA" if sd == "sell" else "CORTA" if sd == "buy" else "?"

          def fichar_hist(hist):
              rows = []
              for h in hist:
                  pnl = fnum(h.get("pnl"))
                  fee = fnum(h.get("fee")) + fnum(h.get("fundingFee")) + fnum(h.get("liqPenalty"))
                  d = str(h.get("direction") or h.get("posSide") or "?").lower()
                  rows.append({"cierre": utc(h.get("uTime")),
                               "nave": str(h.get("instId") or "?").split("-")[0],
                               "dir": "LARGA" if d.startswith("l") else "CORTA" if d.startswith("s") else "?",
                               "ent": pxx(h.get("openAvgPx")), "sal": pxx(h.get("closeAvgPx")),
                               "pnl": pnl, "fee": fee, "neto": pnl + fee, "nf": 0})
              rows.sort(key=lambda r: r["cierre"])
              return rows

          def fichar_fills(unicos):
              por = {}
              for x in unicos:
                  por.setdefault(str(x.get("instId") or "?"), []).append(x)
              cierres, quedan, ult_ent = [], {}, {}
              for inst, fs in por.items():
                  fs.sort(key=ts_de)
                  acum = []
                  for x in fs:
                      if abs(fnum(x.get("fillPnl"))) > 1e-12:
                          acum.append(x)
                          cierres.append(acum)
                          acum = []
                      else:
                          acum.append(x)
                          ult_ent[inst] = x.get("fillPx")
                  if acum:
                      quedan[inst] = acum
              cierres.sort(key=lambda fs: ts_de(fs[-1]))
              rows = []
              for fs in cierres:
                  cf = fs[-1]
                  pnl = sum(fnum(x.get("fillPnl")) for x in fs)
                  fee = sum(fnum(x.get("fee")) for x in fs)
                  inst = str(cf.get("instId") or "?")
                  if len(fs) > 1:
                      ent = pxx(fs[0].get("fillPx"))
                  else:
                      ent = pxx(ult_ent.get(inst)) if inst in ult_ent else "??"
                  rows.append({"cierre": utc(ts_de(cf)), "nave": inst.split("-")[0],
                               "dir": dir_de(cf.get("posSide"), cf.get("side")),
                               "ent": ent, "sal": pxx(cf.get("fillPx")),
                               "pnl": pnl, "fee": fee, "neto": pnl + fee, "nf": len(fs)})
              return rows, quedan

          def imprimir(rows, quedan, n_fills, t0, t1, origen):
              print()
              print(f"ORIGEN DEL DATO: {origen}")
              if rows:
                  print("-" * 76)
                  print(f"{'#':>3} {'CIERRE':<11} {'NAVE':<6} {'DIR':<6} {'ENTRADA':>10} {'SALIDA':>10} "
                        f"{'PNL':>8} {'FEE':>8} {'NETO':>8}  RESULTADO")
                  for i, r in enumerate(rows, 1):
                      res = "GANADA" if r["neto"] > 0.0001 else "PERDIDA" if r["neto"] < -0.0001 else "EMPATE"
                      print(f"{i:>3} {r['cierre']:<11} {r['nave']:<6} {r['dir']:<6} {r['ent']:>10} {r['sal']:>10} "
                            f"{r['pnl']:>+8.2f} {r['fee']:>+8.4f} {r['neto']:>+8.2f}  {res}")
                  print("-" * 76)
                  if origen.startswith("fills") and any(r["ent"] == "??" for r in rows):
                      print("[i] ?? en ENTRADA = la entrada quedo fuera de la ventana de fills")
              g = [r for r in rows if r["neto"] > 0.0001]
              p = [r for r in rows if r["neto"] < -0.0001]
              e = len(rows) - len(g) - len(p)
              wr = 100.0 * len(g) / (len(g) + len(p)) if (g or p) else 0.0
              bruto = sum(r["pnl"] for r in rows)
              comis = sum(r["fee"] for r in rows)
              print(f"RESUMEN: cierres {len(rows)} | ganadas {len(g)} | perdidas {len(p)} | empates {e} | winrate {wr:.1f}%")
              print(f"DINERO: PnL bruto {bruto:+.2f} | comisiones {comis:+.2f} | NETO {bruto + comis:+.2f}")
              if rows:
                  mej = max(rows, key=lambda r: r["neto"])
                  peo = min(rows, key=lambda r: r["neto"])
                  print(f"MEJOR {mej['neto']:+.2f} ({mej['nave']} {mej['dir']} {mej['cierre']}) | "
                        f"PEOR {peo['neto']:+.2f} ({peo['nave']} {peo['dir']} {peo['cierre']})")
                  rg = rp = cg = cp = 0
                  for r in rows:
                      if r["neto"] > 0.0001: cg += 1; cp = 0
                      elif r["neto"] < -0.0001: cp += 1; cg = 0
                      else: cg = cp = 0
                      rg = max(rg, cg); rp = max(rp, cp)
                  print(f"RACHAS: ganadora maxima {rg} | perdedora maxima {rp}")
                  sgn = streak = 0
                  for r in reversed(rows):
                      if abs(r["neto"]) < 0.0001: continue
                      s = 1 if r["neto"] > 0 else -1
                      if sgn == 0: sgn, streak = s, 1
                      elif s == sgn: streak += 1
                      else: break
                  if streak:
                      print(f"RACHA ACTUAL: {streak} {'ganada(s)' if sgn > 0 else 'perdida(s)'}")
                  ag = {}
                  for r in rows:
                      a = ag.setdefault(r["nave"], [0, 0, 0.0])
                      if r["neto"] > 0.0001: a[0] += 1
                      elif r["neto"] < -0.0001: a[1] += 1
                      a[2] += r["neto"]
                  print("POR NAVE: " + " | ".join(f"{k} {v[0]}G/{v[1]}P {v[2]:+.2f}"
                        for k, v in sorted(ag.items(), key=lambda kv: -kv[1][2])))
              else:
                  print("Cuaderno limpio: sin cierres en la ventana")
              if t0:
                  print(f"VENTANA: {t0} -> {t1} UTC ({n_fills} fills)")
              if quedan:
                  print("[i] fills sin cierre (posicion abierta ahora o ventana corta): "
                        + ", ".join(f"{k}({len(v)})" for k, v in sorted(quedan.items())))

          def main():
              print("=" * 76)
              print("BITACORA v4 -", datetime.now(timezone.utc).strftime("%d-%m-%Y %H:%M"), "UTC - solo lectura, nunca opera")
              print("=" * 76)
              if not (key and sec and pwd):
                  print("Faltan secrets OKX en la repo"); sys.exit(1)
              ex = abrir()
              rows, quedan, n, t0, t1 = [], {}, 0, None, None
              origen = ""
              hist = None
              for it in ("FUTURES", "SWAP", ""):
                  try:
                      d = ex.private_get_account_positions_history({"instType": it} if it else {}).get("data", [])
                      if d:
                          hist = d; origen = f"positions-history ({it or 'ALL'})"; break
                  except Exception as e:
                      print(f"  [i] positions-history {it or 'ALL'}: {type(e).__name__} :: {str(e)[:110]}")
              if hist:
                  print(f"[+] positions-history abrio: {len(hist)} registros -> fichando")
                  rows = fichar_hist(hist)
              else:
                  print("  -> positions-history sigue sin abrir; usando operaciones crudas (fills)")
                  unicos, vistos = [], set()
                  for it in ("FUTURES", "SWAP"):
                      after = None
                      for pag in range(PAGINAS):
                          params = {"instType": it, "limit": LIMIT}
                          if after: params["after"] = str(after)
                          try:
                              data = ex.private_get_trade_fills_history(params).get("data", [])
                          except Exception as e:
                              print(f"  [i] fills {it} pag{pag + 1}: {type(e).__name__} :: {str(e)[:110]}")
                              break
                          if not data: break
                          for x in data:
                              bid = str(x.get("billId") or x.get("tradeId") or f"{x.get('instId')}{x.get('ts')}{x.get('fillPx')}")
                              if bid not in vistos:
                                  vistos.add(bid); unicos.append(x)
                          after = min(ts_de(x) for x in data)
                          if len(data) < int(LIMIT): break
                  n = len(unicos)
                  if not unicos:
                      print("[!] Sin operaciones en la ventana. Nada que fichar."); sys.exit(0)
                  print(f"[+] fills crudos: {n} -> fichando (agrupando entradas y salidas)")
                  rows, quedan = fichar_fills(unicos)
                  origen = "fills (fichado automatico)"
                  t0 = utc(min(ts_de(x) for x in unicos))
                  t1 = utc(max(ts_de(x) for x in unicos))
              imprimir(rows, quedan, n, t0, t1, origen)

          if __name__ == "__main__":
              main()
          PYEOF
          python bitacora.py
