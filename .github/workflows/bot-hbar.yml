name: HBAR DESTRUCTOR · v4.1 (LIVE)

on:
  schedule:
    # Cron cada 30 min alineado al marco temporal 30m
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Modo Test (0 = Real / Producción, 1 = Solo catálogo)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: write

concurrency:
  group: hbar-destructor-ciclo
  cancel-in-progress: false

jobs:
  run-hbar-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (ccxt y pandas)
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_hbar

      - name: Ejecutar Bot HBAR DESTRUCTOR
        env:
          OKX_API_KEY:           ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:        ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:          ${{ secrets.OKX_PASSWORD }}
          TEST_MODE:             ${{ github.event.inputs.test_mode || '0' }}
          SINGLE_CYCLE:          '1'
          OKX_HBAR_MAX_NOTIONAL: '9.0'
        run: |
          python3 bot_hbar.py 2>&1 | tee logs_hbar/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "HBAR Bot"
          git config --global user.email "hbar@gscsi.trade"
          git add logs_hbar/ || true
          git commit -m "auto: log HBAR DESTRUCTOR v4.1 (LIVE) [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
