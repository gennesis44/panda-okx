name: El Aprendiz - AVAX EMA 3/21 (1H LIVE)

on:
  schedule:
    # Se dispara cada 20 minutos (puede retrasarse 5-15 min por carga de GH Actions)
    - cron: '*/20 * * * *'
  workflow_dispatch:

# Necesario para que el git push final funcione con el GITHUB_TOKEN por defecto
permissions:
  contents: write

jobs:
  run-avax-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear directorio de logs
        run: mkdir -p logs_avax

      - name: Ejecutar Bot AVAX (LIVE)
        env:
          OKX_API_KEY:         ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:        ${{ secrets.OKX_PASSWORD }}
          # Variables del script AVAX (overrides opcionales vía secrets si quieres):
          SHADOW:              '0'        # 0 = REAL, 1 = SOMBRA
          DRY_RUN:             '0'
          SINGLE_CYCLE:        '1'        # 1 ciclo y salir (modo GitHub Actions)
          AVAX_TF:             '1h'
          AVAX_WINDOW:         '-2,-3,-4'
          AVAX_SEP_LOCK:       '0.17'
          AVAX_SL_MULT:        '1.2'
          AVAX_SL_FLOOR:       '2.0'
          AVAX_SL_CAP:         '2.0'
          AVAX_TP_MULT:        '1.5'
          AVAX_NOTIONAL:       '10.0'
          AVAX_MAX_NOTIONAL:   '15.0'
          AVAX_LEVERAGE:       '1'
          AVAX_MARGIN_MODE:    'isolated'
          COOLDOWN_MIN:        '60'
          AVAX_N_CANDLES:      '200'
        run: |
          python3 avax-go.py 2>&1 | tee logs_avax/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "El Aprendiz Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git add logs_avax/ || true
          git commit -m "auto: log AVAX EMA 3/21 [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
