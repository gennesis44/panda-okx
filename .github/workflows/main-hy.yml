# OKX Historial — TABLA GSCSI S/L · 4 actualizaciones diarias
name: OKX Historial

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-historial
  cancel-in-progress: false

jobs:
  historial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install ccxt
      - name: TABLA GSCSI S/L
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_HY_PASSWORD: ${{ secrets.OKX_PASSPHRASE }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSPHRASE }}
        run: python main-hy.py
