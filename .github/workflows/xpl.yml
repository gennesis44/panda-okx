name: XPL Nave Autónoma (Carbono)

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

concurrency:
  group: xpl-carbono
  cancel-in-progress: false

jobs:
  nave:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
      DRY_RUN: ${{ vars.DRY_RUN || '1' }}
      OKX_LEVERAGE: ${{ vars.OKX_LEVERAGE || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: pip install --upgrade ccxt pandas

      - name: Ciclo único XPL
        run: python xpl.py
