# ==============================================================
# xpl.yml — ARCHIVO DE CONFIGURACIÓN (formato YAML)
# ==============================================================
# ¿Qué es YAML?
#   YAML (YAML Ain't Markup Language) es un formato de texto
#   para guardar datos/ajustes de forma legible para humanos.
#
# Reglas básicas de sintaxis:
#   - La indentación (2 espacios) define la jerarquía, como JSON
#     pero sin llaves {}. NUNCA uses tabuladores, solo espacios.
#   - "clave: valor" crea un par clave-valor (dict en Python).
#   - "clave:" seguido de líneas con "- elemento" crea una lista.
#   - Todo lo que empieza con # es un comentario (se ignora).
#
# Este archivo lo lee xpl.py al arrancar y actúa según él.
# ==============================================================

# --- Sección: datos generales de la aplicación -----------------
app:
  nombre: "XPL Demo"          # Nombre visible de la app
  version: "1.0.0"            # Versión (texto)
  idioma: "es"                # Idioma de los mensajes
  debug: false                # true = imprime info extra de depuración

# --- Sección: ajustes de registro (logging) --------------------
log:
  nivel: "INFO"               # Niveles posibles: DEBUG, INFO, WARNING, ERROR
  archivo: "xpl.log"          # Archivo donde se guardará el registro
  mostrar_en_pantalla: true   # ¿Mostrar también los mensajes por consola?

# --- Sección: ajustes numéricos -------------------------------
ajustes:
  limite_registros: 10        # Máximo de elementos a mostrar en listados
  factor: 2.5                 # Número decimal usado por la tarea "calculo"
  reintentos: 3               # Veces que se reintenta una operación fallida

# --- Sección: lista de tareas que sabe ejecutar xpl.py --------
# Cada tarea tiene:
#   id      -> nombre corto con el que la invocas por terminal
#   tipo    -> qué tipo de acción interna ejecuta
#   activa  -> si está en false, el script la ignora
#   texto   -> parámetro opcional que la tarea usa
tareas:
  - id: "saludo"
    tipo: "saludo"
    activa: true
    texto: "¡Hola desde xpl.yml!"

  - id: "calculo"
    tipo: "calculo"
    activa: true
    texto: ""                  # Sin parámetro; usa el "factor" de arriba

  - id: "fecha"
    tipo: "fecha"
    activa: true
    texto: ""

  - id: "contador"
    tipo: "contador"
    activa: true
    texto: "5"                 # Contará de 1 hasta este número
