name: DOGE.yml

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: perro-doge
  cancel-in-progress: false

jobs:
  zarpar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Desplegar el perro
        uses: actions/checkout@v4

      - name: Montar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Armar ccxt
        run: pip install --upgrade ccxt

      - name: Zarpar
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DOGE_MAX_NOTIONAL: ${{ vars.OKX_DOGE_MAX_NOTIONAL || '15.0' }}
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
        run: python main-doge.py
