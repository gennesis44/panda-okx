app:
  nombre: "GSCSI-XPL Trading Engine"
  version: "2.1.0"

exchange:
  eea_domain: true       # Forzar endpoints de my.okx.com
  sandbox: false         # True para pruebas en Paper Trading / Demo
  api_key: "TU_API_KEY"
  secret: "TU_SECRET"
  passphrase: "TU_PASSPHRASE"

log:
  nivel: "INFO"
  mostrar_en_pantalla: true
  archivo: "xpl_trading.log"

tareas:
  - id: "est_ema_btc_30m"
    tipo: "ema_trading"
    activa: true
    base_asset: "BTC"
    timeframe: "30m"      # Marco temporal de 30 minutos
    intentos: 3           # Entra a verificar 3 veces por ejecución
    ejecutar_orden: false # Cambiar a true para enviar órdenes reales al exchange
