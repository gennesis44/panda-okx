name: xpl-bot

on:
  schedule:
    - cron: '2 * * * *'      # cada hora, al minuto 2 (UTC)
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      dry_run:
        description: 'Simulación (1 = no envía órdenes)'
        default: '1'

concurrency:
  group: xpl-bot
  cancel-in-progress: false   # evita dos ejecuciones a la vez

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install ccxt pandas

      - name: Ejecutar xpl.py
        run: python xpl.py
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
