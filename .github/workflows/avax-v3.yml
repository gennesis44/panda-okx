name: AVAX v3 · validador historia larga + conciliacion (solo lectura)
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Anios de historia 1H (Coinbase AVAX-USD)'
        default: '4.5'
      trades:
        description: 'Trades reales: csv (data/avax_trades.csv) | okx (positions-history, lee con tus claves) | none'
        default: 'csv'
        type: choice
        options: [csv, okx, none]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt==4.5.90 pandas==2.2.3 numpy
      - name: Validar (no envia ordenes)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
        shell: bash
        run: |
          f=$(ls *avax*v3*.py 2>/dev/null | head -n1)
          if [ -z "$f" ]; then
            echo "ERROR: no hay ningun *avax*v3*.py en la raiz. Archivos presentes:"; ls -la; exit 1
          fi
          echo "Ejecutando: $f"
          python "$f" --years ${{ github.event.inputs.years }} --trades ${{ github.event.inputs.trades }} | tee avax_v3_resumen.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avax-validacion-v3
          if-no-files-found: ignore
          path: |
            avax_v3_resumen.txt
            avax_grid_largo.csv
            avax_conciliacion.csv
