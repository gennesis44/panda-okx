name: LA ESTELAR · Navío XLM EMA 3/21 1H (LIVE)

on:
  schedule:
    # Ventana de cruce en últimas 2 velas cerradas (cron cada 20 min)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      shadow_mode:
        description: 'Modo de Ejecución (0 = COMBATE REAL, 1 = Sombra / Prueba)'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: write

concurrency:
  group: estelar-xlm-ciclo
  cancel-in-progress: false

jobs:
  run-xlm-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias (ccxt)
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Crear directorio de logs
        run: mkdir -p logs_xlm

      - name: Ejecutar Navío XLM — LA ESTELAR (main-xlm.py)
        env:
          OKX_API_KEY:      ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:   ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:     ${{ secrets.OKX_PASSWORD }}
          # NAVE ARMADA EN PRODUCCIÓN ('0' = REAL). Usar '1' solo para pruebas en sombra.
          SHADOW:           ${{ github.event.inputs.shadow_mode || '0' }}
          DRY_RUN:          '0'
          # Parámetros de calibración XLM (1 ct = 100 XLM ~$17 nocional)
          XLM_TF:           '1h'
          XLM_CONTRACTS:    '1'
          XLM_MAX_NOTIONAL: '20.0'
          XLM_SEP_LOCK:     '0.15'
          XLM_SL_MULT:      '1.2'
          XLM_SL_FLOOR:     '1.5'
          XLM_SL_CAP:       '3.5'
          XLM_TP_MULT:      '1.5'
          COOLDOWN_MIN:     '60'
        run: |
          python3 main-xlm.py 2>&1 | tee logs_xlm/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "La Estelar Bot"
          git config --global user.email "estelar@gscsi.trade"
          git add logs_xlm/ || true
          git commit -m "auto: log LA ESTELAR XLM (1 ct - LIVE) [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
