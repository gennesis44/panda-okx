# atalaya-main.yml — LA VIGIA · CORAZON PROPIO DEL ATALAYA (decreto Carbono v4)
#   La atalaya quedo SIN CORAZON (su yml borrao en la limpieza de la
#   doctrina v4). Este lo restaura. NO es yml de destructor: es el del
#   VIGIA — el unico que lanza naves.
#
#   Que hace main-atalaya.py en cada latido (cada 15 min):
#     1. LEE EL MAR de cada destructor (separacion EMA rapida/lenta,
#        velas cerradas, ley de flota 0.15%).
#     2. CANDADO DE REGIMEN (RADAR): BTC en rango 7d = candado cerrado,
#        NADIE zarpa. ARMADO por defecto. Para desarmarlo, descomenta
#        ATALAYA_GATE: "0" aqui abajo.
#     3. CATAPULTA: si canta senal, EJECUTA directo el casco de la
#        raiz: python main-{moneda}.py con SINGLE_CYCLE=1. Sin .yml de
#        navios, sin GITHUB_TOKEN, sin 403.
#     4. LIBRO DE BITACORA (el arca): si un casco ya tiene posicion
#        abierta o rastro desde la vela del cruce, NO se relanza
#        ("YA EN LA MAR").
#
#   ASTILLERO ACTUAL (raiz del repo): DOGE, ADA, AVAX, HBAR, XLM*,
#   XRP, INJ, SUI.  (*XLM sin casco en el repo: la catapulta lo salta
#   con "SIN CASCO" — cuando se reconstruya, zarpa solo.)
#   Fail-closed: casco que no compila no se lanza; libro ilegible, no
#   se lanza; sin lectura del mar, no se lanza.
name: atalaya-main
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ccxt pandas requests
      - name: ATALAYA - vigia y catapulta de toda la flota
        run: python main-atalaya.py
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          LAUNCH_SHIPS: "DOGE,ADA,AVAX,HBAR,XLM,XRP,INJ,SUI"
          # --- candado y tuning (todo por defecto ya batallado) ---
          # ATALAYA_GATE: "0"      # desarma el candado BTC 7d (por defecto ARMADO)
          # ATALAYA_LOCK: "0.0015" # apertura de olas que canta senal (0.15%)
          # ATALAYA_WINDOW: "-2,-3,-4"  # velas donde debe nacer el cruce
          # LAUNCH_TIMEOUT: "300"  # tope de seguridad por zarpe (seg)
