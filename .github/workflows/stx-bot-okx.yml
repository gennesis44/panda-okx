# .github/workflows/stx-bot-okx.yml — STX Bot OKX · decreto STX
#   Ciclo unico por run + cron cada 20 min (mismo patron que sui-bot-okx)
#   NO opera USDT: XPERP STX/USD vencimiento mas lejano (fallback SWAP USD)
#   Guardias Ax3 activas: guardia $15 | cooldown fail-closed | clOrdId idempotente
name: STX Bot OKX

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
  push:
    paths:
      - 'main-stx.py'
      - '.github/workflows/stx-bot-okx.yml'

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
      SINGLE_CYCLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install ccxt pandas

      - name: Ejecutar ciclo STX
        run: python main-stx.py
