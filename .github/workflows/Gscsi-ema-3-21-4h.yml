name: GSCSI EMA 3-21 4H

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

env:
  PYTHON_VERSION: '3.11'
  # === PRODUCCIÓN ===
  SHADOW: '0'                    # 0 = REAL
  FORCE_ENTRY: '1'               # 1 = entrada ya mismo
  SIDE: 'buy'                    # buy o sell
  SYMBOL: 'BTC/USDC'
  TIMEFRAME: '4h'
  EMA_FAST: '3'
  EMA_SLOW: '21'
  SL_PCT: '4.0'
  TP_PCT: '6.0'
  POSITION_SIZE_USDC: '50'
  LEVERAGE: '1'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt

      - name: Run GSCSI EMA Bot (PRODUCCIÓN)
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          SHADOW: ${{ env.SHADOW }}
          FORCE_ENTRY: ${{ env.FORCE_ENTRY }}
          SIDE: ${{ env.SIDE }}
          SYMBOL: ${{ env.SYMBOL }}
          TIMEFRAME: ${{ env.TIMEFRAME }}
          EMA_FAST: ${{ env.EMA_FAST }}
          EMA_SLOW: ${{ env.EMA_SLOW }}
          SL_PCT: ${{ env.SL_PCT }}
          TP_PCT: ${{ env.TP_PCT }}
          POSITION_SIZE_USDC: ${{ env.POSITION_SIZE_USDC }}
          LEVERAGE: ${{ env.LEVERAGE }}
        run: |
          python gscsi_ema_3_21_4h.py
