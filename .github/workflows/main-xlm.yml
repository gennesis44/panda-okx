# =====================================================================
# main-xlm.yml — NAVIO XLM · LA FLOTA CARBONO · BUQUE: LA ESTELAR
# .github/workflows/main-xlm.yml
#
# 100% AUTONOMO: main-xlm.py no necesita ningun otro archivo del repo.
# Este workflow solo instala la libreria ccxt (version certificada)
# y suelta el barco al mar cada 20 minutos.
#
# ESTADO: BOTADURA EN SOMBRA — SHADOW: '1' (bitacora de senales, sin
#         municion). Doctrina: sombra antes que munición.
# ARMADO: cambiar SHADOW: '1' -> SHADOW: '0' cuando la sombra haya
#         registrado senales legales y el capitan lo decrete.
# FRENO FLOTA: variable del repo DRY_RUN=1 -> fuerza sombra en todo
#
# SECRETS (REQUERIDOS en modo ARMADO — sin ellos, fail-closed, no zarpa):
#   OKX_API_KEY, OKX_SECRET_KEY, OKX_PASSWORD (u OKX_PASSPHRASE)
# =====================================================================

name: main-xlm

on:
  schedule:
    - cron: '*/20 * * * *'   # 3 vigilias por hora (vela 1H -> 3 chequeos)
  workflow_dispatch:          # boton manual "Run workflow" para pruebas

permissions:
  contents: read

concurrency:
  group: xlm-estelar          # una sola vigilia XLM a la vez, sin solapes
  cancel-in-progress: false   # buque botado: la vigilia NUNCA se aborta

jobs:
  vigilia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abordar el repo
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arsenal (ccxt version certificada en pruebas)
        run: python -m pip install --quiet "ccxt==4.5.90"

      - name: Vigilia XLM — La Estelar
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD || secrets.OKX_PASSPHRASE }}
          SHADOW: '1'
          DRY_RUN: ${{ vars.DRY_RUN || '0' }}
          XLM_CONTRACTS: '1'
        run: python main-xlm.py
