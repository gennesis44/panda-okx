name: "LA ESTELAR - XLM EMA 3/21 (1H LIVE)"

on:
  schedule:
    # 1H timeframe: 1 run por hora cubre la ventana de 2 velas cerradas
    - cron: '0 * * * *'
  workflow_dispatch:

# Necesario para que el git push final funcione con el GITHUB_TOKEN por defecto
permissions:
  contents: write

jobs:
  run-xlm-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas

      - name: Crear directorio de logs
        run: mkdir -p logs_xlm

      - name: Ejecutar Bot XLM (LIVE)
        env:
          OKX_API_KEY:         ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY:      ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD:        ${{ secrets.OKX_PASSWORD }}
          SHADOW:              '0'        # 0 = REAL (default flota)
          DRY_RUN:             '0'
          SINGLE_CYCLE:        '1'        # 1 ciclo y salir (GH Actions)
          XLM_TF:              '1h'       # peritaje 25-oct
          XLM_CONTRACTS:       '0'        # 0 = AUTO dinámico
          XLM_NOTIONAL:       '20.0'      # target (decreto XLM)
          XLM_MAX_NOTIONAL:   '20.0'      # guardia (decreto XLM)
          XLM_SEP_LOCK:       '0.15'      # auditado
          XLM_SL_FLOOR:       '1.5'       # peritaje (PF 1.19)
          XLM_SL_CAP:         '3.5'       # defensivo
          XLM_TP_MULT:        '1.5'       # peritaje
          COOLDOWN_MIN:       '60'
        run: |
          python3 xlm-main.py 2>&1 | tee logs_xlm/run_$(date -u +%Y%m%d_%H%M).log

      - name: Commit y Push de logs
        if: always()
        run: |
          git config --global user.name  "La Estelar Bot"
          git config --global user.email "aprendiz@gscsi.trade"
          git add logs_xlm/ || true
          git commit -m "auto: log XLM LA ESTELAR [skip ci]" || echo "Sin cambios"
          git push || echo "Push omitido"
