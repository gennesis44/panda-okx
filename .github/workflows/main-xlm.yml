name: XLM Bot OKX

on:
  schedule:
    - cron: '52,22 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xlm-bot
  cancel-in-progress: false

jobs:
  run-xlm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt pandas
      - name: Run XLM Bot
        run: |
          python - <<'EOF'
          import importlib.util
          s = importlib.util.spec_from_file_location('b', 'main-xlm.py')
          b = importlib.util.module_from_spec(s)
          s.loader.exec_module(b)
          sym = b.resolve_symbol()
          print('symbol', sym)
          print('meta (ctval, ccy, settle, price, usd_por_contrato)', b._contract_meta(sym))
          print('capacity_ok', b.capacity_ok(sym, b.AMOUNT))
          print('posicion abierta', bool(b.get_open_position(sym)))
          print('cooldown', b.cooldown_active(sym))
          print('senal', b.evaluate_signal(sym))
          EOF
        env:
          SINGLE_CYCLE: '1'
          PYTHONUNBUFFERED: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
