name: XLM Bot OKX [DIQUE SECO - MS-0]

on:
  workflow_dispatch:   # SOLO manual — para inspeccion. Sin cron: no navega.

permissions:
  contents: read

concurrency:
  group: xlm-bot
  cancel-in-progress: false

jobs:
  run-xlm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install ccxt pandas
      - name: XLM en DIQUE SECO (MS-0)
        run: python main-xlm.py
        env:
          SINGLE_CYCLE: '1'
          PYTHONUNBUFFERED: '1'
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
