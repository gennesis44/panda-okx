name: PANDA GSCSI Stats

on:
  push:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: panda-gscsi-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install requests pandas numpy python-dateutil ccxt
      - name: Run PANDA stats
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_FLAG: "1"
        run: python panda_gscsi_live.py --mode stats
